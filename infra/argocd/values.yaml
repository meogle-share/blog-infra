# ArgoCD configuration
# Reference: https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd

argo-cd:
  # Server configuration
  server:
    ingress:
      enabled: false
    service:
      type: ClusterIP
      externalIPs:
        - 10.8.0.1
      servicePortHttp: 33000
    extraArgs:
      - --insecure

  # Disable unused components for minimal setup
  dex:
    enabled: false

  notifications:
    enabled: false

  applicationSet:
    enabled: true

  # Repository credentials (configure as needed)
  configs:
    repositories: {}
    credentialTemplates: {}
