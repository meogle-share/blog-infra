name: ArgoCD Sync Notification

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'infra/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Changed Apps
        id: changes
        run: |
          CHANGED_APPS=""
          if git diff --name-only HEAD~1 HEAD | grep -q "^apps/meogle-was/"; then
            CHANGED_APPS="$CHANGED_APPS meogle-was"
          fi
          if git diff --name-only HEAD~1 HEAD | grep -q "^apps/meogle-ui/"; then
            CHANGED_APPS="$CHANGED_APPS meogle-ui"
          fi
          if git diff --name-only HEAD~1 HEAD | grep -q "^apps/meogle-nginx/"; then
            CHANGED_APPS="$CHANGED_APPS meogle-nginx"
          fi
          if git diff --name-only HEAD~1 HEAD | grep -q "^infra/postgres/"; then
            CHANGED_APPS="$CHANGED_APPS postgres"
          fi
          if git diff --name-only HEAD~1 HEAD | grep -q "^infra/argocd/"; then
            CHANGED_APPS="$CHANGED_APPS argocd"
          fi
          echo "apps=$CHANGED_APPS" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## ArgoCD Auto-Sync Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following apps will be synced by ArgoCD:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for app in ${{ steps.changes.outputs.apps }}; do
            echo "- \`$app\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ArgoCD auto-sync is enabled. Changes will be applied automatically." >> $GITHUB_STEP_SUMMARY

