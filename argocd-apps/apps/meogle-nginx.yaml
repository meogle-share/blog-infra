apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meogle-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/meogle-share/blog-infra.git
    targetRevision: main
    path: apps/meogle-nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: meogle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
