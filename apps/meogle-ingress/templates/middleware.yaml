{{- if .Values.ingress.enabled -}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "meogle-ingress.fullname" . }}-strip-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "meogle-ingress.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /api
{{- end }}