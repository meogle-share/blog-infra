apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meogle-was.fullname" . }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "meogle-was.labels" . | nindent 4 }}
type: Opaque
data:
  DB_DATABASE: {{ .Values.db.name | b64enc | quote }}
  DB_USERNAME: {{ .Values.db.username | b64enc | quote }}
  DB_PASSWORD: {{ .Values.db.password | b64enc | quote }}
  JWT_SECRET: {{ .Values.jwt.secret | b64enc | quote }}
