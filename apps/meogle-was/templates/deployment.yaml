apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meogle-was.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "meogle-was.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "meogle-was.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meogle-was.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: was
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: {{ .Values.port }}
          envFrom:
            - configMapRef:
                name: {{ include "meogle-was.fullname" . }}-config
          env:
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "meogle-was.fullname" . }}-secret
                  key: DB_DATABASE
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "meogle-was.fullname" . }}-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "meogle-was.fullname" . }}-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "meogle-was.fullname" . }}-secret
                  key: JWT_SECRET
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory | quote }}
              cpu: {{ .Values.resources.requests.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.memory | quote }}
              cpu: {{ .Values.resources.limits.cpu | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
