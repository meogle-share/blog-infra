{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "meogle-nginx.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "meogle-nginx.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.domain }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          # API routes: /api/* -> was (strip /api prefix)
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.was.serviceName }}
                port:
                  number: {{ .Values.was.port }}
          # Default routes: /* -> ui
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ui.serviceName }}
                port:
                  number: {{ .Values.ui.port }}
{{- end }}
